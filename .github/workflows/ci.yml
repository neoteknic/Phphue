name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        experimental: [false]
        include:
          # Early warning for the next PHP release; never blocks the build.
          - php: nightly
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      # composer.lock is not versioned: resolve the newest dependencies for each PHP version.
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: composer phpstan

      # Any deprecation, notice or warning raised by src/ fails the run (phpunit.xml.dist).
      - name: PHPUnit
        run: composer phpunit

      - name: Coding style
        if: matrix.php == '8.5'
        run: composer cs
